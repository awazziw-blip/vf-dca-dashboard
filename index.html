<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VF-DCA 2.3.1 — Portfolio Command Center</title>
<meta name="theme-color" content="#0b1020">
<style>
:root{--bg:#080c17;--panel:#101726;--panel2:#141d30;--line:#25314a;--text:#f4f7fb;--muted:#95a3b8;--good:#38d39f;--warn:#f4bd50;--bad:#ff6b78;--accent:#7aa2ff;--accent2:#8d7cff;--shadow:0 18px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#182a52 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid var(--line);background:rgba(8,12,23,.86);backdrop-filter:blur(18px)}.brand{padding:0 10px 24px}.brand b{font-size:20px;letter-spacing:.3px}.brand small{display:block;color:var(--muted);margin-top:4px}.nav{display:grid;gap:8px}.nav button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px 13px;border-radius:12px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.side-foot{position:absolute;left:28px;right:28px;bottom:24px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:7px}.main{padding:28px 34px 60px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:26px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}h1{font-size:32px;margin:4px 0 6px;letter-spacing:-.7px}.sub{color:var(--muted)}.status{border:1px solid var(--line);background:rgba(16,23,38,.8);padding:10px 14px;border-radius:999px;color:#c9d4e5;white-space:nowrap}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.2fr .8fr}.card{background:linear-gradient(180deg,rgba(20,29,48,.94),rgba(14,21,35,.94));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.kpi .label,.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.kpi .value{font-size:27px;font-weight:750;margin-top:8px}.kpi .hint{color:var(--muted);font-size:12px;margin-top:5px}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.section h2{margin:0;font-size:18px}.section-note{color:var(--muted);font-size:12px}.portfolio-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.pbtn{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;color:var(--text);text-align:left}.pbtn.active{outline:2px solid var(--accent);background:#15213a}.pbtn .pid{font-size:11px;color:var(--accent);font-weight:700}.pbtn .pname{font-weight:700;margin:3px 0 8px}.pbtn .pvalue{font-size:16px}.pbtn .cycle{color:var(--muted);font-size:10px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.action-list{display:grid;gap:10px;margin-top:14px}.order{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:13px;background:#0d1422}.order strong{font-size:17px}.buy{color:var(--good)}.hold{color:#b9c4d5}.trim{color:var(--warn)}.money-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.mini{background:#0d1422;border:1px solid var(--line);border-radius:12px;padding:13px}.mini b{display:block;font-size:18px;margin-top:5px}.table{width:100%;border-collapse:collapse}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:12px 8px;border-bottom:1px solid rgba(37,49,74,.65)}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line)}.pill.BUY,.pill.PASS{color:var(--good);background:rgba(56,211,159,.08)}.pill.TRIM_REVIEW,.pill.REVIEW{color:var(--warn);background:rgba(244,189,80,.08)}.pill.HOLD{color:#c4cfdf}.pill.FAIL{color:var(--bad);background:rgba(255,107,120,.08)}.alloc-row{display:grid;grid-template-columns:72px 1fr 62px 62px;gap:10px;align-items:center;margin:12px 0}.bar{height:9px;border-radius:99px;background:#202b41;overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.muted{color:var(--muted)}.attention{display:grid;gap:10px}.alert{border-left:3px solid var(--warn);padding:12px 14px;background:#0d1422;border-radius:0 12px 12px 0}.alert.good{border-color:var(--good)}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.sys{display:flex;flex-wrap:wrap;gap:8px}.sys span{border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--muted)}.sys b{color:var(--good)}.error{max-width:700px;margin:12vh auto;padding:24px;border:1px solid var(--bad);border-radius:18px;background:var(--panel)}@media(max-width:1000px){.app{display:block}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px}.brand{padding-bottom:12px}.nav{grid-template-columns:repeat(5,1fr)}.nav button{text-align:center;padding:9px}.side-foot{display:none}.main{padding:22px}.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.portfolio-strip{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){h1{font-size:25px}.top{display:block}.status{display:inline-block;margin-top:12px}.g4{grid-template-columns:1fr 1fr}.portfolio-strip{display:flex;overflow:auto}.pbtn{min-width:165px}.money-flow{grid-template-columns:1fr}.alloc-row{grid-template-columns:60px 1fr 48px}.alloc-row .target{display:none}.table{font-size:12px}.hide-mobile{display:none}}

/* v1.1 UX refinement */
:root{--p1:#55b7ff;--p2:#8b7cff;--p3:#37d7a3;--p4:#f2b84b;--p5:#ef7aa8;--pc:var(--p3)}
body{background:radial-gradient(circle at 78% -12%,color-mix(in srgb,var(--pc) 18%,#14213c) 0,transparent 35%),var(--bg)}
.main{max-width:1440px}.top{margin-bottom:18px}.portfolio-strip{margin-top:6px}.pbtn{position:relative;overflow:hidden}.pbtn:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pcard)}.pbtn.active{outline:2px solid var(--pcard);background:color-mix(in srgb,var(--pcard) 10%,#101726)}.pbtn .pid{color:var(--pcard)}
.hero-cycle{margin-top:20px;border:1px solid color-mix(in srgb,var(--pc) 42%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 12%,#121b2d),rgba(14,21,35,.96));box-shadow:0 24px 70px color-mix(in srgb,var(--pc) 9%,transparent)}
.hero-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.hero-kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--pc);font-weight:800}.hero-value{font-size:34px;font-weight:800;letter-spacing:-.7px;margin-top:4px}.hero-remain{text-align:right}.hero-remain b{font-size:24px;display:block}.execution-track{height:8px;background:#202b41;border-radius:99px;margin:18px 0 14px;overflow:hidden}.execution-track i{display:block;height:100%;background:var(--pc);border-radius:99px}.hero-orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hero-order{padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(8,12,23,.48);display:flex;justify-content:space-between;gap:12px;align-items:center}.hero-order strong{font-size:18px}.hero-order .amount{font-size:18px;font-weight:800}.hero-foot{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:12px}
.compact-kpis{display:grid;grid-template-columns:1.35fr .9fr .9fr;gap:12px;margin-top:14px}.compact-kpis .card{padding:15px 17px}.compact-kpis .value{font-size:22px}
.analytics-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.alloc-row{grid-template-columns:72px 1fr 64px 64px}.bar{overflow:visible}.bar>i{opacity:.95}.target-mark{position:absolute;top:-5px;width:2px;height:19px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px rgba(8,12,23,.75)}.target-mark:after{content:"";position:absolute;top:-2px;left:-3px;width:8px;height:8px;border-radius:50%;background:#fff}.alloc-row.over b,.alloc-row.over .current{color:var(--warn)}.alloc-legend{display:flex;gap:18px;color:var(--muted);font-size:11px;margin-bottom:16px}.legend-line{display:inline-block;width:16px;height:3px;background:var(--pc);vertical-align:middle;margin-right:6px;border-radius:5px}.legend-target{display:inline-block;width:2px;height:13px;background:#fff;vertical-align:middle;margin:0 8px 0 3px}
.stack{display:grid;gap:16px}.performance .perf-head{display:flex;justify-content:space-between;align-items:end}.performance .big{font-size:27px;font-weight:800}.pending-box{margin-top:14px;padding:17px;border:1px dashed var(--line);border-radius:13px;color:var(--muted);background:rgba(8,12,23,.28)}
.decision-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.decision-card{padding:14px;border:1px solid var(--line);border-radius:14px;background:#0d1422}.decision-card .dc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.decision-card .ticker{font-size:17px;font-weight:800}.decision-card .dc-meta{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:12px}.decision-card .dc-meta b{color:var(--text);display:block;font-size:14px}.decision-card.BUY{border-color:rgba(56,211,159,.35)}.decision-card.TRIM_REVIEW{border-color:rgba(244,189,80,.35)}
.section.attn{margin-top:22px}.attention{grid-template-columns:repeat(2,minmax(0,1fr))}.alert{font-size:13px}
@media(max-width:1000px){.analytics-grid{grid-template-columns:1fr}.decision-cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.hero-head{display:block}.hero-remain{text-align:left;margin-top:12px}.hero-orders{grid-template-columns:1fr}.compact-kpis{grid-template-columns:1fr 1fr}.compact-kpis .card:first-child{grid-column:1/-1}.decision-cards{grid-template-columns:1fr}.attention{grid-template-columns:1fr}.alloc-row{grid-template-columns:58px 1fr 52px}.alloc-row .target{display:none}.hero-value{font-size:29px}}
</style></head>
<body><div id="app"><div class="error">กำลังโหลด dashboard.json…</div></div>
<script>
const $=s=>document.querySelector(s);const money=v=>v==null?'—':new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(v);const pct=v=>v==null?'—':(Number(v)*100).toFixed(1)+'%';const num=v=>v==null?'—':new Intl.NumberFormat('th-TH',{maximumFractionDigits:2}).format(v);
let D,selected='P003';
function pill(v){return `<span class="pill ${String(v||'').replaceAll(' ','_')}">${v??'N/A'}</span>`}
function portfolio(id){return D.portfolio_summaries.find(x=>x.portfolio_id===id)}
const COLORS={P001:'#55b7ff',P002:'#8b7cff',P003:'#37d7a3',P004:'#f2b84b',P005:'#ef7aa8'};
function render(){
 const p=portfolio(selected)||D.portfolio_summaries[0]; selected=p.portfolio_id;
 document.documentElement.style.setProperty('--pc',COLORS[selected]||'#7aa2ff');
 const assets=D.assets.filter(x=>x.portfolio_id===selected), orders=D.consolidated_orders.filter(x=>x.portfolio_id===selected), rec=D.remaining_cash_reconciliation[selected]||{}, goal=D.goals?.[selected]||{}, rmf=D.rmf?.[selected];
 const maxw=Math.max(.01,...assets.map(x=>x.current_weight||0),...assets.map(x=>x.target_weight||0));
 const nav=D.portfolio_summaries.map(x=>`<button class="${x.portfolio_id===selected?'active':''}" style="--pcard:${COLORS[x.portfolio_id]||'#7aa2ff'}" onclick="selected='${x.portfolio_id}';render()">${x.portfolio_id}</button>`).join('');
 const pstrip=D.portfolio_summaries.map(x=>`<button class="pbtn ${x.portfolio_id===selected?'active':''}" style="--pcard:${COLORS[x.portfolio_id]||'#7aa2ff'}" onclick="selected='${x.portfolio_id}';render()"><div class="pid">${x.portfolio_id}</div><div class="pname">${x.portfolio_name}</div><div class="pvalue">${money(x.current_portfolio_value)}</div><div class="cycle">${x.cycle_status==='SNAPSHOT_ONLY'?'DATA PENDING':x.cycle_status?.includes('LEGACY')?'LEGACY':'CURRENT'} · ${x.latest_cycle_id}</div></button>`).join('');
 const orderHtml=orders.length?orders.map(o=>`<div class="hero-order"><div><span class="pill BUY">BUY</span> &nbsp;<strong>${o.ticker}</strong><div class="muted">${num(o.quantity)} units × ${money(o.price)}</div></div><div class="amount">${money(o.amount)}</div></div>`).join(''):`<div class="empty" style="grid-column:1/-1">ไม่มีคำสั่งซื้อใน cycle นี้</div>`;
 const execPct=(p.budget&&p.actual_buy!=null)?Math.max(0,Math.min(100,p.actual_buy/p.budget*100)):0;
 const alloc=assets.length?`<div class="alloc-legend"><span><i class="legend-line"></i>Current</span><span><i class="legend-target"></i>Target</span></div>`+assets.map(a=>{const cur=(a.current_weight||0)/maxw*100,tgt=(a.target_weight||0)/maxw*100,over=(a.current_weight||0)>(a.target_weight||0);return `<div class="alloc-row ${over?'over':''}"><b>${a.ticker}</b><div class="bar" title="Current ${pct(a.current_weight)} / Target ${pct(a.target_weight)}"><i style="width:${Math.min(100,cur)}%"></i><span class="target-mark" style="left:${Math.min(100,tgt)}%"></span></div><span class="current">${pct(a.current_weight)}</span><span class="target muted">${pct(a.target_weight)}</span></div>`}).join(''):`<div class="empty">Allocation detail ยังไม่มีใน production export</div>`;
 const decisions=assets.length?`<div class="decision-cards">${assets.map(a=>`<div class="decision-card ${a.action||''}"><div class="dc-top"><span class="ticker">${a.ticker}</span>${pill(a.action)}</div><div class="dc-meta"><span>Gap<b>${pct(a.allocation_gap)}</b></span><span>Score<b>${num(a.dca_score)}</b></span><span>MOS<b>${pct(a.mos)}</b></span></div></div>`).join('')}</div>`:`<div class="empty">Decision detail ยังไม่มีใน production export</div>`;
 const notes=(selected==='P003'&&D.surveillance_notes?.length)?D.surveillance_notes.slice(0,4).map(n=>`<div class="alert">${n}</div>`).join(''):`<div class="empty">ไม่มี surveillance note สำหรับ portfolio นี้ใน export ปัจจุบัน</div>`;
 const rmfHtml=rmf?`<div style="overflow:auto"><table class="table"><thead><tr><th>Fund</th><th>Units</th><th>NAV</th><th>Value</th><th>Weight</th></tr></thead><tbody>${rmf.holdings.map(h=>`<tr><td><b>${h.ticker}</b></td><td>${num(h.quantity)}</td><td>${num(h.current_price)}</td><td>${money(h.market_value)}</td><td>${h.actual_weight}</td></tr>`).join('')}</tbody></table></div>`:'';
 const sys=Object.entries(D.system_status||{}).map(([k,v])=>`<span>${k.replaceAll('_',' ')}: <b>${v}</b></span>`).join('');
 const performance=D.performance?.[selected];
 const perfHtml=performance?`<div class="performance"><div class="label">Performance vs Benchmark</div><div class="perf-head"><div><div class="big">${pct(performance.portfolio_return)}</div><div class="muted">Portfolio</div></div><div style="text-align:right"><div class="big">${pct(performance.benchmark_return)}</div><div class="muted">${performance.benchmark_name||'Benchmark'}</div></div></div><div class="hero-foot"><span>Excess return: <b>${pct(performance.excess_return)}</b></span><span>Period: ${performance.period||'—'}</span></div></div>`:`<div class="performance"><div class="label">Performance vs Benchmark</div><div class="pending-box"><b>DATA PENDING</b><br>Production export ยังไม่มี portfolio return / benchmark return จึงไม่คำนวณใน browser</div></div>`;
 $('#app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>VF-DCA</b><small>Portfolio Command Center</small></div><div class="nav">${nav}</div><div class="side-foot"><span class="dot"></span>${D.metadata.master_identifier}<br>${D.metadata.core_formula}</div></aside><main class="main">
 <div class="top"><div><div class="eyebrow">${p.portfolio_id} · ${p.portfolio_type}</div><h1>${p.portfolio_name}</h1><div class="sub">${goal.objective||'Portfolio'} · Cycle ${p.latest_cycle_id}</div></div><div class="status"><span class="dot"></span>${p.cycle_status}</div></div>
 <div class="portfolio-strip">${pstrip}</div>
 <section class="card hero-cycle"><div class="hero-head"><div><div class="hero-kicker">🎯 THIS CYCLE · ACTION FIRST</div><div class="hero-value">${p.actual_buy==null?'DATA PENDING':money(p.actual_buy)+' invested'}</div><div class="muted">Budget ${money(p.budget)} · ${orders.length?orders.length+' executable order'+(orders.length>1?'s':''):'No executable order'}</div></div><div class="hero-remain"><span class="muted">Remaining pool</span><b>${money(p.remaining_pool)}</b><span class="pill ${p.reconciliation_status}">${p.reconciliation_status}</span></div></div><div class="execution-track"><i style="width:${execPct}%"></i></div><div class="hero-orders">${orderHtml}</div><div class="hero-foot"><span>Executed <b>${p.actual_buy==null?'—':execPct.toFixed(1)+'%'}</b></span><span>Planned <b>${money(p.planned_executable_buy)}</b></span><span>Minimum buy <b>${money(p.minimum_buy)}</b></span></div></section>
 <div class="compact-kpis"><div class="card kpi"><div class="label">Portfolio Value</div><div class="value">${money(p.current_portfolio_value)}</div><div class="hint">Current production state</div></div><div class="card kpi"><div class="label">Cycle Budget</div><div class="value">${money(p.budget)}</div></div><div class="card kpi"><div class="label">Remaining</div><div class="value">${money(p.remaining_pool)}</div></div></div>
 <section class="section"><div class="section-head"><h2>📊 Portfolio Balance</h2><div class="section-note">Current allocation with target markers</div></div><div class="analytics-grid"><div class="card">${alloc}</div><div class="stack"><div class="card">${perfHtml}</div><div class="card"><div class="label">Goal</div><h3 style="font-size:22px;margin:9px 0">${goal.goal_target!=null?money(goal.goal_target)+' / '+(goal.goal_unit||''):'DATA PENDING'}</h3><div class="muted">${goal.objective||'—'} · ${goal.horizon_years??'—'} years</div>${goal.goal_progress==null?'':`<div class="hero-foot"><span>Progress <b>${pct(goal.goal_progress)}</b></span></div>`}</div></div></div></section>
 <section class="section attn"><div class="section-head"><h2>⚠️ Attention</h2><div class="section-note">What needs review now</div></div><div class="card attention">${notes}</div></section>
 <section class="section"><div class="section-head"><h2>🧭 Decision Summary</h2><div class="section-note">Action · Gap · Score · MOS</div></div>${decisions}</section>
 ${rmfHtml?`<section class="section"><div class="section-head"><h2>🏦 RMF Holdings</h2></div><div class="card">${rmfHtml}</div></section>`:''}
 <section class="section"><div class="section-head"><h2>🛡️ System Health</h2><div class="section-note">Presentation layer status</div></div><div class="card"><div class="sys">${sys}</div><p class="muted" style="margin-bottom:0">Audit: ${D.audit_integrity?.audit_status??'—'} · Dashboard sync: ${D.system_status?.dashboard_sync??'—'} · Dividend: ${D.dividend?.status??'—'}</p></div></section>
 </main></div>`
}
fetch('./data/dashboard.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{D=x;render()}).catch(e=>{$('#app').innerHTML=`<div class="error"><h2>Dashboard data unavailable</h2><p>ไม่สามารถโหลด <code>./data/dashboard.json</code></p><p class="muted">${e.message}</p></div>`});
</script></body></html>
