<style>

dow);transition:background .28s ease,border-color .28s ease}.portfolio-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}.pbtn{position:relative;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--pcard) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--pcard) 28%,var(--line));border-radius:15px;padding:15px;color:var(--text);text-align:left;transition:background .2s ease,border-color .2s ease,transform .2s ease}.pbtn:hover{background:color-mix(in srgb,var(--pcard) 13%,var(--panel));transform:translateY(-1px)}.pbtn:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pcard)}.pbtn.active{outline:2px solid color-mix(in srgb,var(--pcard) 82%,#fff 18%);background:color-mix(in srgb,var(--pcard) 17%,#101726);border-color:color-mix(in srgb,var(--pcard) 58%,var(--line))}.pbtn .pid{display:inline-flex;align-items:center;font-size:10px;color:var(--pcard);font-weight:800;border:1px solid color-mix(in srgb,var(--pcard) 48%,transparent);background:color-mix(in srgb,var(--pcard) 12%,transparent);padding:2px 7px;border-radius:999px}.pbtn .pname{font-weight:700;margin:5px 0 8px}.pbtn .pvalue{font-size:16px}.pbtn .cycle{color:var(--muted);font-size:10px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero{margin-top:20px;border-color:color-mix(in srgb,var(--pc) 82%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 38%,#101827) 0%,color-mix(in srgb,var(--pc) 30%,#0f1727) 55%,color-mix(in srgb,var(--pc) 20%,#0c1321) 100%);box-shadow:0 22px 60px rgba(0,0,0,.34),inset 0 1px 0 color-mix(in srgb,var(--pc) 28%,transparent)}.hero-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.hero-kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--pc) 88%,#fff 12%);font-weight:900}.hero-value{font-size:34px;font-weight:800;margin-top:4px}.hero-side{text-align:right}.hero-side b{font-size:24px;display:block}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 14px}.flowbox{background:color-mix(in srgb,var(--pc) 18%,rgba(8,12,23,.68));border:1px solid color-mix(in srgb,var(--pc) 44%,var(--line));border-radius:13px;padding:13px}.flowbox span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.flowbox b{display:block;font-size:20px;margin-top:5px}.planned-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.plan-card{padding:14px 15px;border:1px solid color-mix(in srgb,var(--pc) 58%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--pc) 20%,rgba(8,12,23,.68));display:flex;justify-content:space-between;gap:12px;align-items:center}.plan-card .amount{font-size:18px;font-weight:800}.plan-meta{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.4}.plan-meta b{color:var(--text);font-weight:700}.hero-foot{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:12px}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.section h2{margin:0;font-size:18px;color:color-mix(in srgb,var(--pc) 58%,var(--text))}.section-note{color:var(--muted);font-size:12px}.compact-kpis{display:grid;grid-template-columns:1.35fr .9fr .9fr;gap:12px;margin-top:14px}.kpi .label,.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.kpi .value{font-size:24px;font-weight:750;margin-top:7px}.analytics-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.alloc-legend{display:flex;gap:18px;color:var(--muted);font-size:11px;margin-bottom:16px}.legend-line{display:inline-block;width:16px;height:3px;background:var(--pc);vertical-align:middle;margin-right:6px}.legend-target{display:inline-block;width:2px;height:13px;background:#fff;vertical-align:middle;margin:0 8px 0 3px}.alloc-row{display:grid;grid-template-columns:90px 1fr 64px 64px;gap:10px;align-items:center;margin:12px 0}.bar{height:9px;border-radius:99px;background:#202b41;position:relative}.bar>i{display:block;height:100%;background:var(--pc);border-radius:99px}.target-mark{position:absolute;top:-5px;width:2px;height:19px;background:#fff;border-radius:2px}.target-mark:after{content:"";position:absolute;top:-2px;left:-3px;width:8px;height:8px;border-radius:50%;background:#fff}.over b,.over .current{color:var(--warn)}.stack{display:grid;gap:16px}.big{font-size:27px;font-weight:800}.pending-box,.empty{padding:17px;border:1px dashed color-mix(in srgb,var(--pc) 20%,var(--line));border-radius:13px;color:var(--muted);background:color-mix(in srgb,var(--pc) 4%,rgba(8,12,23,.3))}.decision-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.decision-card{padding:15px;border:1px solid color-mix(in srgb,var(--pc) 18%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--pc) 5%,#0d1422)}.decision-card.BUY{border-color:rgba(56,211,159,.38)}.decision-card.TRIM_REVIEW{border-color:rgba(244,189,80,.38)}.dc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.ticker{font-size:16px;font-weight:800}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid var(--line)}.pill.BUY,.pill.PASS{color:var(--good);background:rgba(56,211,159,.08)}.pill.TRIM_REVIEW{color:var(--warn);background:rgba(244,189,80,.08)}.dc-money{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.dc-money>div{background:color-mix(in srgb,var(--pc) 4%,#111a2b);border:1px solid rgba(37,49,74,.7);border-radius:10px;padding:9px}.dc-money span,.dc-meta span{color:var(--muted);font-size:10px}.dc-money b,.dc-meta b{display:block;color:var(--text);font-size:14px;margin-top:2px}.dc-money .planned b{color:var(--good)}.dc-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.reason{color:var(--muted);font-size:11px;margin-top:10px}.execution-line{color:var(--muted);font-size:11px;margin-top:9px}.execution-line b{color:var(--text)}.table{width:100%;border-collapse:collapse}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:12px 8px;border-bottom:1px solid rgba(37,49,74,.65)}.sys{display:flex;flex-wrap:wrap;gap:8px}.sys span{border:1px solid color-mix(in srgb,var(--pc) 18%,var(--line));padding:7px 10px;border-radius:999px;color:var(--muted);background:color-mix(in srgb,var(--pc) 4%,transparent)}.sys b{color:var(--good)}.error{max-width:700px;margin:12vh auto;padding:24px;border:1px solid var(--bad);border-radius:18px;background:var(--panel)}
@media(max-width:1000px){.app{display:block}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px}.side-foot{display:none}.nav{grid-template-columns:repeat(5,1fr)}.main{padding:22px}.portfolio-strip{grid-template-columns:repeat(2,1fr)}.analytics-grid{grid-template-columns:1fr}.decision-cards{grid-template-columns:repeat(2,1fr)}}

<body><div id="app"><div class="error">กำลังโหลด dashboard.json…</div></div>
<script>
const $=s=>document.querySelector(s);
const money=v=>v==null||v===''?'DATA PENDING':new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(Number(v));
const price=v=>v==null||v===''?'DATA PENDING':new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',minimumFractionDigits:2,maximumFractionDigits:4}).format(Number(v));
const pct=v=>v==null||v===''?'—':(Number(v)*100).toFixed(1)+'%';
const num=v=>v==null||v===''?'—':new Intl.NumberFormat('th-TH',{maximumFractionDigits:2}).format(Number(v));
const safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let D,selected='P005';
const COLORS={P001:'#55b7ff',P002:'#56d39b',P003:'#e5b85c',P004:'#a98bff',P005:'#ff9b62'};
function portfolio(id){return D.portfolio_summaries.find(x=>x.portfolio_id===id)}
function pill(v){const c=String(v||'').replace(/[^A-Z0-9_]/gi,'_');return `<span class="pill ${c}">${safe(v??'N/A')}</span>`}
function displayAssetAmount(a,field,p){if(a[field]!==undefined&&a[field]!==null&&a[field]!=='')return money(a[field]);const totalField=field==='actual_buy'?'actual_buy':'planned_executable_buy';if(Number(p[totalField])===0)return money(0);return 'DATA PENDING';}
function orderFor(a){return (D.consolidated_orders||[]).find(o=>o.portfolio_id===a.portfolio_id&&o.ticker===a.ticker&&String(o.order_type||'BUY').toUpperCase()==='BUY')||null;}
function executionFields(a){const o=orderFor(a);const quantity=a.shares??o?.quantity??a.board_lot;const executionPrice=a.execution_price??o?.price;return {quantity,executionPrice};}
function render(){
const p=portfolio(selected)||D.portfolio_summaries[0];selected=p.portfolio_id;document.documentElement.style.setProperty('--pc',COLORS[selected]||'#7aa2ff');
const assets=(D.assets||[]).filter(x=>x.portfolio_id===selected);const goal=D.goals?.[selected]||{};const rmf=D.rmf?.[selected];const maxw=Math.max(.01,...assets.map(x=>Number(x.current_weight)||0),...assets.map(x=>Number(x.target_weight)||0));
const pstrip=D.portfolio_summaries.map(x=>`<button class="pbtn ${x.portfolio_id===selected?'active':''}" style="--pcard:${COLORS[x.portfolio_id]||'#7aa2ff'}" onclick="selected='${x.portfolio_id}';render()"><div class="pid">${safe(x.portfolio_id)}</div><div class="pname">${safe(x.portfolio_name)}</div><div class="pvalue">${money(x.current_portfolio_value)}</div><div class="cycle">${safe(x.latest_cycle_id)}</div></button>`).join('');
const nav=D.portfolio_summaries.map(x=>`<button class="${x.portfolio_id===selected?'active':''}" onclick="selected='${x.portfolio_id}';render()">${safe(x.portfolio_id)}</button>`).join('');
const plannedAssets=assets.filter(a=>Number(a.planned_executable_buy)>0);const plannedHtml=plannedAssets.length?plannedAssets.map(a=>{const x=executionFields(a);return `<div class="plan-card"><div>${pill(a.action)} &nbsp;<strong>${safe(a.ticker)}</strong><div class="muted">Actual ${displayAssetAmount(a,'actual_buy',p)}</div><div class="plan-meta">Shares/Units <b>${x.quantity==null?'DATA PENDING':num(x.quantity)}</b> · Expected price <b>${price(x.executionPrice)}</b></div></div><div class="amount">${money(a.planned_executable_buy)}</div></div>`}).join(''):`<div class="empty" style="grid-column:1/-1"><b>No planned buy this cycle</b><br>Portfolio planned amount: ${money(p.planned_executable_buy)}</div>`;
const alloc=assets.length?`<div class="alloc-legend"><span><i class="legend-line"></i>Current</span><span><i class="legend-target"></i>Target</span></div>`+assets.map(a=>{const cur=(Number(a.current_weight)||0)/maxw*100,tgt=(Number(a.target_weight)||0)/maxw*100,over=(Number(a.current_weight)||0)>(Number(a.target_weight)||0);return `<div class="alloc-row ${over?'over':''}"><b>${safe(a.ticker)}</b><div class="bar"><i style="width:${Math.min(100,cur)}%"></i><span class="target-mark" style="left:${Math.min(100,tgt)}%"></span></div><span class="current">${pct(a.current_weight)}</span><span class="target muted">${pct(a.target_weight)}</span></div>`}).join(''):`<div class="empty">Allocation detail unavailable</div>`;
const decisions=assets.length?`<div class="decision-cards">${assets.map(a=>{const x=executionFields(a);return `<div class="decision-card ${safe(a.action||'')}"><div class="dc-top"><span class="ticker">${safe(a.ticker)}</span>${pill(a.action)}</div><div class="dc-money"><div class="planned"><span>Planned Buy</span><b>${displayAssetAmount(a,'planned_executable_buy',p)}</b></div><div><span>Actual Buy</span><b>${displayAssetAmount(a,'actual_buy',p)}</b></div></div>${Number(a.planned_executable_buy)>0?`<div class="execution-line">Shares/Units <b>${x.quantity==null?'DATA PENDING':num(x.quantity)}</b> · Expected price <b>${price(x.executionPrice)}</b></div>`:''}<div class="dc-meta"><span>Gap<b>${pct(a.allocation_gap)}</b></span><span>Score<b>${num(a.dca_score)}</b></span><span>MOS<b>${pct(a.mos)}</b></span></div>${a.decision_reason?`<div class="reason">${safe(a.decision_reason)}</div>`:''}</div>`}).join('')}</div>`:`<div class="empty">Decision detail unavailable</div>`;
const performance=D.performance?.portfolios?.[selected]||null;const perfHtml=performance&&performance.portfolio_return!=null?`<div><div class="label">Performance vs Benchmark</div><div class="big">${pct(performance.portfolio_return)}</div><div class="muted">Benchmark ${pct(performance.benchmark_return)} · Alpha ${pct(performance.alpha)}</div></div>`:`<div><div class="label">Performance vs Benchmark</div><div class="pending-box"><b>DATA PENDING</b><br>Production export does not yet contain return data.</div></div>`;
const rmfHtml=rmf?`<div class="table-wrap"><table class="table"><thead><tr><th>Fund</th><th>Units</th><th>NAV</th><th>Value</th><th>Weight</th></tr></thead><tbody>${rmf.holdings.map(h=>`<tr><td><b>${safe(h.ticker)}</b></td><td>${num(h.quantity)}</td><td>${num(h.current_price)}</td><td>${money(h.market_value)}</td><td>${pct(h.actual_weight)}</td></tr>`).join('')}</tbody></table></div>`:'';
const sys=Object.entries(D.system_status||{}).map(([k,v])=>`<span>${safe(k.replaceAll('_',' '))}: <b>${safe(v)}</b></span>`).join('');const planned=Number(p.planned_executable_buy)||0,actual=Number(p.actual_buy)||0;const pendingExecution=Math.max(0,planned-actual);const pendingLabel=pendingExecution>0?'Pending execution':'Remaining pool';
$('#app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>VF-DCA</b><small>Portfolio Command Center</small></div><div class="nav">${nav}</div><div class="side-foot"><span class="dot"></span>${safe(D.metadata.master_identifier)}<br>${safe(D.metadata.core_formula)}</div></aside><main class="main"><div class="top"><div><div class="eyebrow">${safe(p.portfolio_id)} · ${safe(p.portfolio_type)}</div><h1>${safe(p.portfolio_name)}</h1><div class="sub">${safe(goal.objective||'Portfolio')} · Cycle ${safe(p.latest_cycle_id)}</div></div><div class="status"><span class="dot"></span>${safe(p.cycle_status)}</div></div><div class="portfolio-strip">${pstrip}</div><section class="card hero"><div class="hero-head"><div><div class="hero-kicker">🎯 THIS CYCLE · ACTION FIRST</div><div class="hero-value">Planned ${money(p.planned_executable_buy)}</div><div class="muted">Decision allocation from audited production data</div></div><div class="hero-side"><span class="muted">${pendingLabel}</span><b>${pendingExecution>0?money(pendingExecution):money(p.remaining_pool)}</b><span class="pill ${safe(p.reconciliation_status)}">${safe(p.reconciliation_status)}</span></div></div><div class="flow"><div class="flowbox"><span>Planned</span><b>${money(p.planned_executable_buy)}</b></div><div class="flowbox"><span>Executed</span><b>${money(p.actual_buy)}</b></div><div class="flowbox"><span>Remaining Pool</span><b>${money(p.remaining_pool)}</b></div></div><div class="planned-list">${plannedHtml}</div><div class="hero-foot"><span>Budget <b>${money(p.budget)}</b></span><span>Minimum buy <b>${money(p.minimum_buy)}</b></span><span>Execution drift <b>${num(p.execution_drift)}</b></span></div></section><div class="compact-kpis"><div class="card kpi"><div class="label">Portfolio Value</div><div class="value">${money(p.current_portfolio_value)}</div></div><div class="card kpi"><div class="label">Cycle Budget</div><div class="value">${money(p.budget)}</div></div><div class="card kpi"><div class
