<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VF-DCA 2.3.1 — Portfolio Command Center</title>
<meta name="theme-color" content="#0b1020">
<style>
:root{--bg:#080c17;--panel:#101726;--panel2:#141d30;--line:#25314a;--text:#f4f7fb;--muted:#95a3b8;--good:#38d39f;--warn:#f4bd50;--bad:#ff6b78;--accent:#7aa2ff;--accent2:#8d7cff;--shadow:0 18px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#182a52 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid var(--line);background:rgba(8,12,23,.86);backdrop-filter:blur(18px)}.brand{padding:0 10px 24px}.brand b{font-size:20px;letter-spacing:.3px}.brand small{display:block;color:var(--muted);margin-top:4px}.nav{display:grid;gap:8px}.nav button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px 13px;border-radius:12px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.side-foot{position:absolute;left:28px;right:28px;bottom:24px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:7px}.main{padding:28px 34px 60px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:26px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}h1{font-size:32px;margin:4px 0 6px;letter-spacing:-.7px}.sub{color:var(--muted)}.status{border:1px solid var(--line);background:rgba(16,23,38,.8);padding:10px 14px;border-radius:999px;color:#c9d4e5;white-space:nowrap}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.2fr .8fr}.card{background:linear-gradient(180deg,rgba(20,29,48,.94),rgba(14,21,35,.94));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.kpi .label,.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.kpi .value{font-size:27px;font-weight:750;margin-top:8px}.kpi .hint{color:var(--muted);font-size:12px;margin-top:5px}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.section h2{margin:0;font-size:18px}.section-note{color:var(--muted);font-size:12px}.portfolio-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.pbtn{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;color:var(--text);text-align:left}.pbtn.active{outline:2px solid var(--accent);background:#15213a}.pbtn .pid{font-size:11px;color:var(--accent);font-weight:700}.pbtn .pname{font-weight:700;margin:3px 0 8px}.pbtn .pvalue{font-size:16px}.pbtn .cycle{color:var(--muted);font-size:10px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.action-list{display:grid;gap:10px;margin-top:14px}.order{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:13px;background:#0d1422}.order strong{font-size:17px}.buy{color:var(--good)}.hold{color:#b9c4d5}.trim{color:var(--warn)}.money-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.mini{background:#0d1422;border:1px solid var(--line);border-radius:12px;padding:13px}.mini b{display:block;font-size:18px;margin-top:5px}.table{width:100%;border-collapse:collapse}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:12px 8px;border-bottom:1px solid rgba(37,49,74,.65)}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line)}.pill.BUY,.pill.PASS{color:var(--good);background:rgba(56,211,159,.08)}.pill.TRIM_REVIEW,.pill.REVIEW{color:var(--warn);background:rgba(244,189,80,.08)}.pill.HOLD{color:#c4cfdf}.pill.FAIL{color:var(--bad);background:rgba(255,107,120,.08)}.alloc-row{display:grid;grid-template-columns:72px 1fr 62px 62px;gap:10px;align-items:center;margin:12px 0}.bar{height:9px;border-radius:99px;background:#202b41;overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.muted{color:var(--muted)}.attention{display:grid;gap:10px}.alert{border-left:3px solid var(--warn);padding:12px 14px;background:#0d1422;border-radius:0 12px 12px 0}.alert.good{border-color:var(--good)}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.sys{display:flex;flex-wrap:wrap;gap:8px}.sys span{border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--muted)}.sys b{color:var(--good)}.error{max-width:700px;margin:12vh auto;padding:24px;border:1px solid var(--bad);border-radius:18px;background:var(--panel)}@media(max-width:1000px){.app{display:block}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px}.brand{padding-bottom:12px}.nav{grid-template-columns:repeat(5,1fr)}.nav button{text-align:center;padding:9px}.side-foot{display:none}.main{padding:22px}.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.portfolio-strip{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){h1{font-size:25px}.top{display:block}.status{display:inline-block;margin-top:12px}.g4{grid-template-columns:1fr 1fr}.portfolio-strip{display:flex;overflow:auto}.pbtn{min-width:165px}.money-flow{grid-template-columns:1fr}.alloc-row{grid-template-columns:60px 1fr 48px}.alloc-row .target{display:none}.table{font-size:12px}.hide-mobile{display:none}}
</style></head>
<body><div id="app"><div class="error">กำลังโหลด dashboard.json…</div></div>
<script>
const $=s=>document.querySelector(s);const money=v=>v==null?'—':new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(v);const pct=v=>v==null?'—':(Number(v)*100).toFixed(1)+'%';const num=v=>v==null?'—':new Intl.NumberFormat('th-TH',{maximumFractionDigits:2}).format(v);
let D,selected='P003';
function pill(v){return `<span class="pill ${String(v||'').replaceAll(' ','_')}">${v??'N/A'}</span>`}
function portfolio(id){return D.portfolio_summaries.find(x=>x.portfolio_id===id)}
function render(){const p=portfolio(selected)||D.portfolio_summaries[0];selected=p.portfolio_id;const assets=D.assets.filter(x=>x.portfolio_id===selected);const orders=D.consolidated_orders.filter(x=>x.portfolio_id===selected);const rec=D.remaining_cash_reconciliation[selected]||{};const goal=D.goals?.[selected]||{};const rmf=D.rmf?.[selected];const maxw=Math.max(.01,...assets.map(x=>x.current_weight||0),...assets.map(x=>x.target_weight||0));
const nav=D.portfolio_summaries.map(x=>`<button class="${x.portfolio_id===selected?'active':''}" onclick="selected='${x.portfolio_id}';render()">${x.portfolio_id}</button>`).join('');
const pstrip=D.portfolio_summaries.map(x=>`<button class="pbtn ${x.portfolio_id===selected?'active':''}" onclick="selected='${x.portfolio_id}';render()"><div class="pid">${x.portfolio_id}</div><div class="pname">${x.portfolio_name}</div><div class="pvalue">${money(x.current_portfolio_value)}</div><div class="cycle">${x.latest_cycle_id}</div></button>`).join('');
const orderHtml=orders.length?orders.map(o=>`<div class="order"><div><span class="pill BUY">BUY</span> &nbsp;<strong>${o.ticker}</strong><div class="muted">${num(o.quantity)} units × ${money(o.price)}</div></div><strong>${money(o.amount)}</strong></div>`).join(''):`<div class="empty">ไม่มีคำสั่งซื้อใน cycle นี้</div>`;
const alloc=assets.length?assets.map(a=>`<div class="alloc-row"><b>${a.ticker}</b><div class="bar" title="Current ${pct(a.current_weight)} / Target ${pct(a.target_weight)}"><i style="width:${Math.min(100,(a.current_weight||0)/maxw*100)}%"></i></div><span>${pct(a.current_weight)}</span><span class="target muted">→ ${pct(a.target_weight)}</span></div>`).join(''):`<div class="empty">Allocation detail ยังไม่มีใน production export</div>`;
const assetTable=assets.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Asset</th><th>Action</th><th>Current</th><th>Target</th><th>Gap</th><th>Score</th><th>MOS</th><th>Actual Buy</th></tr></thead><tbody>${assets.map(a=>`<tr><td><b>${a.ticker}</b><div class="muted">Rank ${a.ranking??'—'}</div></td><td>${pill(a.action)}</td><td>${pct(a.current_weight)}</td><td>${pct(a.target_weight)}</td><td>${pct(a.allocation_gap)}</td><td>${num(a.dca_score)}</td><td>${pct(a.mos)}</td><td>${money(a.actual_buy)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Decision detail ยังไม่มีใน production export</div>`;
const notes=(selected==='P003'&&D.surveillance_notes?.length)?D.surveillance_notes.slice(0,5).map(n=>`<div class="alert">${n}</div>`).join(''):`<div class="empty">ไม่มี surveillance note สำหรับ portfolio นี้ใน export ปัจจุบัน</div>`;
const rmfHtml=rmf?`<div style="overflow:auto"><table class="table"><thead><tr><th>Fund</th><th>Units</th><th>NAV</th><th>Value</th><th>Weight</th></tr></thead><tbody>${rmf.holdings.map(h=>`<tr><td><b>${h.ticker}</b></td><td>${num(h.quantity)}</td><td>${num(h.current_price)}</td><td>${money(h.market_value)}</td><td>${h.actual_weight}</td></tr>`).join('')}</tbody></table></div>`:'';
const sys=Object.entries(D.system_status||{}).map(([k,v])=>`<span>${k.replaceAll('_',' ')}: <b>${v}</b></span>`).join('');
$('#app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>VF-DCA</b><small>Portfolio Command Center</small></div><div class="nav">${nav}</div><div class="side-foot"><span class="dot"></span>${D.metadata.master_identifier}<br>${D.metadata.core_formula}</div></aside><main class="main"><div class="top"><div><div class="eyebrow">${p.portfolio_id} · ${p.portfolio_type}</div><h1>${p.portfolio_name}</h1><div class="sub">Cycle ${p.latest_cycle_id} · Generated ${D.metadata.generated_at}</div></div><div class="status"><span class="dot"></span>${p.cycle_status}</div></div><div class="portfolio-strip">${pstrip}</div>
<section class="section"><div class="grid g4"><div class="card kpi"><div class="label">Portfolio Value</div><div class="value">${money(p.current_portfolio_value)}</div><div class="hint">Current production state</div></div><div class="card kpi"><div class="label">Cycle Budget</div><div class="value">${money(p.budget)}</div><div class="hint">Minimum buy ${money(p.minimum_buy)}</div></div><div class="card kpi"><div class="label">Actual Buy</div><div class="value">${money(p.actual_buy)}</div><div class="hint">Planned ${money(p.planned_executable_buy)}</div></div><div class="card kpi"><div class="label">Remaining Pool</div><div class="value">${money(p.remaining_pool)}</div><div class="hint">Reconciliation ${p.reconciliation_status}</div></div></div></section>
<section class="section"><div class="section-head"><h2>🎯 This Cycle</h2><div class="section-note">Action first · analytics second</div></div><div class="grid g2"><div class="card"><div class="label">Executable Orders</div><div class="action-list">${orderHtml}</div></div><div class="card"><div class="label">Cash Reconciliation</div><div class="money-flow"><div class="mini"><span class="muted">Budget</span><b>${money(rec.monthly_budget??p.budget)}</b></div><div class="mini"><span class="muted">Actual</span><b>${money(rec.actual_buy_total??p.actual_buy)}</b></div><div class="mini"><span class="muted">Remain</span><b>${money(rec.remaining_cash_pool??p.remaining_pool)}</b></div></div><p class="muted">Status: ${rec.reconciled===true?'PASS':rec.reconciled==null?'DATA PENDING':'REVIEW'} · Cash policy: ${rec.cash_policy??'—'}</p></div></div></section>
<section class="section"><div class="section-head"><h2>📊 Allocation</h2><div class="section-note">Current weight → Target weight</div></div><div class="grid g2"><div class="card">${alloc}</div><div class="card"><div class="label">Goal</div><h3 style="font-size:24px;margin:10px 0">${goal.goal_target!=null?money(goal.goal_target)+' / '+(goal.goal_unit||''):'DATA PENDING'}</h3><div class="muted">${goal.objective||'—'} · Horizon ${goal.horizon_years??'—'} years</div><div class="empty" style="margin-top:18px">Goal progress: ${goal.goal_progress==null?'DATA PENDING':pct(goal.goal_progress)}</div></div></div></section>
<section class="section"><div class="section-head"><h2>🧭 Decision Matrix</h2><div class="section-note">Values are rendered from production JSON; no browser decision recalculation</div></div><div class="card">${assetTable}</div></section>
${rmfHtml?`<section class="section"><div class="section-head"><h2>🏦 RMF Holdings</h2></div><div class="card">${rmfHtml}</div></section>`:''}
<section class="section"><div class="section-head"><h2>⚠️ Attention</h2><div class="section-note">Only exported surveillance items</div></div><div class="card attention">${notes}</div></section>
<section class="section"><div class="section-head"><h2>🛡️ System Health</h2><div class="section-note">Presentation layer status</div></div><div class="card"><div class="sys">${sys}</div><p class="muted" style="margin-bottom:0">Audit: ${D.audit_integrity?.audit_status??'—'} · Dashboard sync: ${D.system_status?.dashboard_sync??'—'} · Dividend: ${D.dividend?.status??'—'}</p></div></section>
</main></div>`}
fetch('./data/dashboard.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{D=x;render()}).catch(e=>{$('#app').innerHTML=`<div class="error"><h2>Dashboard data unavailable</h2><p>ไม่สามารถโหลด <code>./data/dashboard.json</code></p><p class="muted">${e.message}</p></div>`});
</script></body></html>
